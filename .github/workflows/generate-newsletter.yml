- name: Commit and push new issue
        run: |
          git config --global user.name "StreamSignal Bot"
          git config --global user.email "bot@streamsignal.io"
          git pull --rebase origin main-branch
          echo "node_modules/" > .gitignore
          echo "package-lock.json" >> .gitignore
          git rm -r --cached node_modules/ 2>/dev/null || true
          git rm --cached package-lock.json 2>/dev/null || true
          git add .gitignore index.html archive/ .issue-count
          git diff --staged --quiet || git commit -m "Newsletter: $(date +'%B %d, %Y')"
          git push origin main-branch
