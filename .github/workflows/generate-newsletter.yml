name: Generate StreamSignal Newsletter

on:
  schedule:
    - cron: '0 8 * * 3'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Debug - list files
        run: |
          echo "Current directory: $(pwd)"
          echo "Files here:"
          ls -la

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Generate newsletter
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/generate.js

      - name: Commit and push new issue
        run: |
          git config --global user.name "StreamSignal Bot"
          git config --global user.email "bot@streamsignal.io"
          git add index.html archive/
          git diff --staged --quiet || git commit -m "Newsletter: $(date +'%B %d, %Y')"
          git push
